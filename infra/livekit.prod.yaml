port: 7880
bind_addresses:
  - 0.0.0.0

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
  # In GCP, this will be the Public IP of your Media Node
  udp_port: 7882

keys:
  # These MUST match your .env LIVEKIT_API_KEY and LIVEKIT_API_SECRET
  ${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}

logging:
  level: info
