version: '3.8'

services:
  # --- THE APPLICATION POD ---
  # These services run on BOTH Machine 2 and Machine 3 (2GB RAM each)
  
  http-backend:
    image: us-central1-docker.pkg.dev/${PROJECT_ID}/mypencil/http-backend:latest
    container_name: mypencil-http
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${HUB_IP}:5432/${POSTGRES_DB}
      REDIS_URL: redis://${HUB_IP}:6379
      RABBITMQ_URL: amqp://${RABBIT_USER}:${RABBIT_PASS}@${HUB_IP}:5672
      LIVEKIT_URL: ws://${HUB_IP}:7880
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
    networks:
      - mypencil-app-net

  ws-backend:
    image: us-central1-docker.pkg.dev/${PROJECT_ID}/mypencil/ws-backend:latest
    container_name: mypencil-ws
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      PORT: 3003
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${HUB_IP}:5432/${POSTGRES_DB}
      REDIS_URL: redis://${HUB_IP}:6379
      RABBITMQ_URL: amqp://${RABBIT_USER}:${RABBIT_PASS}@${HUB_IP}:5672
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      IMAGE_UPLOAD_BASE_URL: ${IMAGE_UPLOAD_BASE_URL}
      IMAGE_CDN_BASE_URL: ${IMAGE_CDN_BASE_URL}
    networks:
      - mypencil-app-net

  ai-service:
    image: us-central1-docker.pkg.dev/${PROJECT_ID}/mypencil/ai-service:latest
    container_name: mypencil-ai
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 400M
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${HUB_IP}:5432/${POSTGRES_DB}
      RABBITMQ_URL: amqp://${RABBIT_USER}:${RABBIT_PASS}@${HUB_IP}:5672
      REDIS_URL: redis://${HUB_IP}:6379
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-2.5-flash}
      GEMINI_SUMMARY_MODEL: ${GEMINI_SUMMARY_MODEL:-gemini-2.5-flash}
      GEMINI_EMBED_MODEL: ${GEMINI_EMBED_MODEL:-gemini-embedding-2}
      GEMINI_EMBED_DIMENSION: ${GEMINI_EMBED_DIMENSION:-1536}
    networks:
      - mypencil-app-net

  transcript:
    image: us-central1-docker.pkg.dev/${PROJECT_ID}/mypencil/transcript:latest
    container_name: mypencil-transcript
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 300M
    environment:
      HTTP_BACKEND_URL: http://http-backend:3001
      LIVEKIT_URL: ws://${HUB_IP}:7880
    networks:
      - mypencil-app-net

networks:
  mypencil-app-net:
    driver: bridge
