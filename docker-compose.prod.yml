version: "3.8"

services:
  # --- INFRASTRUCTURE LAYER ---
  postgres:
    image: postgres:15-alpine
    container_name: mypencil-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pencil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pencil_secret}
      POSTGRES_DB: ${POSTGRES_DB:-mypencil}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mypencil-net

  redis:
    image: redis:7-alpine
    container_name: mypencil-redis
    restart: always
    command: redis-server --appendonly yes
    networks:
      - mypencil-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mypencil-queue
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-pencil}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS:-pencil_secret}
    networks:
      - mypencil-net

  livekit:
    image: livekit/livekit-server:latest
    container_name: mypencil-media
    restart: always
    command: ["--config", "/etc/livekit.yaml", "--bind", "0.0.0.0"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./infra/livekit.prod.yaml:/etc/livekit.yaml:ro
    networks:
      - mypencil-net

  # --- APPLICATION LAYER (DISTRIBUTED) ---
  # Node 01: Handles half the traffic
  backend-node-01:
    build:
      context: .
      dockerfile: apps/http-backend/Dockerfile
    container_name: mypencil-backend-01
    depends_on:
      - postgres
      - redis
      - rabbitmq
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pencil}:${POSTGRES_PASSWORD:-pencil_secret}@postgres:5432/${POSTGRES_DB:-mypencil}?schema=public
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBIT_USER:-pencil}:${RABBIT_PASS:-pencil_secret}@rabbitmq:5672
      NODE_ENV: production
      PORT: 8000
    networks:
      - mypencil-net

  # Node 02: Proves the Pub/Sub Sync
  backend-node-02:
    build:
      context: .
      dockerfile: apps/http-backend/Dockerfile
    container_name: mypencil-backend-02
    depends_on:
      - postgres
      - redis
      - rabbitmq
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pencil}:${POSTGRES_PASSWORD:-pencil_secret}@postgres:5432/${POSTGRES_DB:-mypencil}?schema=public
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBIT_USER:-pencil}:${RABBIT_PASS:-pencil_secret}@rabbitmq:5672
      NODE_ENV: production
      PORT: 8000
    networks:
      - mypencil-net

  # --- FRONTEND ---
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: mypencil-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost/api
      NEXT_PUBLIC_WS_URL: ws://localhost/ws
    networks:
      - mypencil-net

  # --- LOAD BALANCER (NGINX) ---
  # This is the "Traffic Cop" that distributes users to different nodes
  gateway:
    image: nginx:alpine
    container_name: mypencil-gateway
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-node-01
      - backend-node-02
      - web
    networks:
      - mypencil-net

networks:
  mypencil-net:
    driver: bridge

volumes:
  postgres_data:
