version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: pencil-postgres
    restart: always
    environment:
      POSTGRES_USER: ritesh
      POSTGRES_PASSWORD: ritesh25
      POSTGRES_DB: pencil
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pencil-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pencil.io
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
  redis:
    image: redis:7
    container_name: pencil-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  pgadmin_data:
  redis_data: