worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50M;

    # --- High Performance Request & Buffer Optimizations ---
    client_body_buffer_size      5M;       # Store up to 5MB of request body in memory directly
    client_header_buffer_size    64k;      # Handle large authentication headers and JWT cookies
    large_client_header_buffers  4 64k;

    proxy_buffer_size            128k;     # Handle large proxy headers from node applications
    proxy_buffers                4 256k;
    proxy_busy_buffers_size      256k;

    # Raise timeouts for massive data uploads and stable WebSocket streams
    client_body_timeout          300s;
    client_header_timeout        300s;
    send_timeout                 300s;
    proxy_read_timeout           300s;
    proxy_send_timeout           300s;

    # ─── LOAD BALANCERS ───────────────────────────────────────────────────────

    # HTTP API Load Balancer (Port 3001)
    upstream api_cluster {
        server 10.190.0.3:3001;
        server 10.190.0.4:3001;
    }

    # WebSocket Load Balancer (Port 3003)
    upstream ws_cluster {
        ip_hash; # Sticky sessions for WebSockets
        server 10.190.0.3:3003;
        server 10.190.0.4:3003;
    }

    # ─── HTTPS API GATEWAY (api.mypencil.tech) ──────────────────────────────

    server {
        listen 443 ssl;
        server_name api.mypencil.tech;

        ssl_certificate /etc/letsencrypt/live/api.mypencil.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.mypencil.tech/privkey.pem;

        # Standard API Requests
        location / {
            proxy_pass http://api_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Real-time WebSocket Traffic
        location /socket.io/ {
            proxy_pass http://ws_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # Upload Endpoint (Binary)
        location /upload/ {
            proxy_pass http://ws_cluster;
            client_max_body_size 50M;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # ─── LIVEKIT GATEWAY (livekit.mypencil.tech) ──────────────────────────

    server {
        listen 443 ssl;
        server_name livekit.mypencil.tech;

        ssl_certificate /etc/letsencrypt/live/api.mypencil.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.mypencil.tech/privkey.pem;

        location / {
            proxy_pass http://10.190.0.2:7880;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name api.mypencil.tech livekit.mypencil.tech;
        return 301 https://$host$request_uri;
    }
}
